schema_version: 1

context:
  version: "12.8.0"

package:
  name: sysstat
  version: ${{ version }}

source:
  url: https://github.com/sysstat/sysstat/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8aa2054c56c941ab30e1b14ad2e0076a7e6d6bf01f50e22d954885b8a7f9a679

build:
  number: 0
  skip: not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
    - autoconf

tests:
  - script:
      - sar --help
      - sadf -V
      - iostat
      - tapestat -V
      - mpstat
      - pidstat
      - cifsiostat -V

about:
  license: GPL-2.0-or-later
  license_file: COPYING
  summary: Performance monitoring tools for Linux
  description: |
    The sysstat package contains various utilities, common to many commercial
    Unixes, to monitor system performance and usage activity:

    * iostat reports CPU statistics and input/output statistics for block devices and partitions.
    * mpstat reports individual or combined processor related statistics.
    * pidstat reports statistics for Linux tasks (processes) : I/O, CPU, memory, etc.
    * tapestat reports statistics for tape drives connected to the system.
    * cifsiostat reports CIFS statistics.

  homepage: http://sebastien.godard.pagesperso-orange.fr/
  repository: https://github.com/sysstat/sysstat
  documentation: http://sebastien.godard.pagesperso-orange.fr/documentation.html

extra:
  recipe-maintainers:
    - chrisburr
